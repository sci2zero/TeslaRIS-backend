databaseChangeLog:
  # Preserve the deployed changeset identity while sorting before the type change.
  - logicalFilePath: db/changelog/changes/change-2026-10-08_1notification-details.yaml
  - changeSet:
      id: 2026-10-08-notification-details
      author: milospopovic
      changes:
        - addColumn:
            tableName: notification
            columns:
              - column:
                  name: details
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: sentiment
                  type: varchar(16)
                  defaultValue: INFO
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: notification
            columnName: details
        - dropColumn:
            tableName: notification
            columnName: sentiment
